name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        run: hugo --minify --enableGitInfo

      - name: Test rendered UI contracts
        run: python3 -m unittest discover -s tests -v

      - name: Run htmltest
        uses: wjdp/htmltest-action@master
        with:
          config: .htmltest.yml

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v9.0.1
        with:
          config: .cspell.config.yaml
          use_cspell_files: true
          suggestions: true
