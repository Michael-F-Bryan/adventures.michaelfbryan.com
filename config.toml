canonifyurls = false
googleAnalytics = "G-M80ZBKQHKV"
enableGitInfo = true
enableEmoji = true

pygmentsStyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[taxonomies]
